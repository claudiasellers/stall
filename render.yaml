# One-click deploy of the Stall web app on Render's free plan.
# Data lives in a free Turso database (Render's free disk is wiped on every restart).
services:
  - type: web
    name: stall
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node --disable-warning=ExperimentalWarning app/src/server.ts
    healthCheckPath: /api/v1/config
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      # Invite-only. This one-time code creates the first admin account; after that,
      # admins hand out single-use invite codes from Admin → Members.
      - key: STALL_BOOTSTRAP_CODE
        generateValue: true
      - key: HOUSE_TZ
        value: America/New_York
      # Bearer token for /api/v1/tick, called by the cron pinger (.github/workflows/tick.yml).
      - key: STALL_TICK_TOKEN
        generateValue: true
      # Photos: Cloudflare R2 (private bucket). Without these, photos go to local disk,
      # which Render's free plan wipes on restart.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: VOTE_MIN_UPVOTES
        value: "3"
      - key: CONSENSUS_RATIO
        value: "0.7"
      - key: REJECT_MIN_DOWNVOTES
        value: "3"
      # Shared with the builder (orchestrator) when you run it.
      - key: STALL_ORCH_TOKEN
        generateValue: true
      - key: STALL_WEBHOOK_SECRET
        generateValue: true
      # Product analytics (docs/ANALYTICS.md). Leave MIXPANEL_TOKEN empty to keep it off.
      - key: MIXPANEL_TOKEN
        sync: false
      - key: ANALYTICS_ID_SALT
        generateValue: true
      # From the Turso dashboard: database URL (libsql://...) and a token.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
